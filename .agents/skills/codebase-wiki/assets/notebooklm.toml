# Optional repository-local configuration for export-notebooklm.py.
# Copy this file to the repository root as notebooklm.toml before editing.

profile = "gemini-notebook-enterprise"
scan_profile = "target"
output_directory = ".notebooklm"
content_mode = "ba_only"
analysis_include_tests = true

# Lower source_limit when the organization's Workspace tier has fewer slots.
source_limit = 300
reserved_source_slots = 0

# Conservative local safety limits; Enterprise currently allows at most
# 500 MB or 500,000 words per source.
# max_source_words uses the additive Han-character/non-Han-token estimate.
max_source_bytes = 450000000
max_source_words = 450000

# Repo-relative UTF-8 files/directories that carry business-owned requirements
# or acceptance specifications. They are analyzed and must be represented in
# the coverage ledger, but their raw text is never uploaded.
business_source_paths = []

# Extra safe paths to analyze. Raw content is never uploaded.
extra_paths = []

# Paths below are in addition to the built-in generated/dependency/credential
# exclusions. All values must remain relative to the repository root.
exclude_paths = []

# Offline DLP masks analysis copies and final BA payloads. Any residual match
# after payload masking blocks commit. Raw repository files are never changed.
dlp_profile = "notebooklm-enterprise-ba-mask-v1"
