[features]
hooks = true

[wiki_guard]
# Installed repos use "wiki-only" by default or explicit "coexist" for normal
# coding sessions. Use "framework" only in this framework repository.
mode = "framework"

[agents]
# Canonical Codex setting; max_threads is retained only as a legacy alias.
max_concurrent_threads_per_session = 6
# Keep the V1 nesting guard for Codex versions that support it; do not rely on
# it as a security boundary because current Codex docs do not document it.
max_depth = 1
